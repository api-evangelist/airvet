x-coverage:
  state: none
  reason: no-developer-program
  detail: 'Airvet is a consumer/employer-benefit pet telehealth app with no developer program: no developer,
    docs or api subdomain resolves in DNS, the airvet GitHub organization has zero public repositories, the
    Zendesk help center has no article matching "api", "developer" or "integration", and airvet.com itself
    sits behind a Vercel Security Checkpoint that answers every path (including /developers, /docs, /api,
    /openapi.json and every /.well-known/ path) with HTTP 429, so the only surfaces readable were the
    HubSpot marketing host, the Next.js parent portal and the help-center API - none of which publish a contract.'
