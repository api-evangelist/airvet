aid: airvet
name: Airvet
description: Airvet is a Los Angeles-based pet telehealth company, founded in 2018, that connects pet parents
  with licensed veterinarians 24/7 by video and chat through its Airvet for Pet Parents app (iOS/Android) and a
  companion Airvet Doctor app for its nationwide network of vets. It sells the service two ways - as "Vetcare as
  a Benefit", an employer-sponsored benefit adopted by companies such as Adobe, Activision, Synchrony and PepsiCo
  that covers every pet in an employee's household, and as a direct annual consumer membership - and layers on
  partner offers such as Pumpkin wellness plans and Healthy Paws insurance. Airvet is a consumer/B2B2C telehealth
  product, not an API platform - as of this profile it publishes no developer portal, API documentation,
  SDKs, webhooks or machine-readable API contract, and its GitHub organization has no public repositories.
